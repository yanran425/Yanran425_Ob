# ===== 站点基本信息 =====
site_name: Yanran_Ob
site_url: https://yanran425.github.io/Yanran425_Ob/
repo_url: https://github.com/yanran425/Yanran425_Ob

# ===== 主题外观 =====
theme:
  name: material
  language: zh

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: 切换到跟随系统

  font:
    text: Noto Sans SC
    code: JetBrains Mono

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

# ===== 插件 =====
plugins:
  - search:
      lang: zh
  - awesome-pages
  - tags:
      tags_file: tags.md
  - glightbox:
      touchNavigation: true       # 移动端支持滑动
      loop: false                  # 到最后一张不循环
      effect: zoom                 # 弹窗打开效果：缩放
      zoomable: true               # 支持滚轮缩放
      draggable: true              # 支持拖拽
      width: 90%                   # 弹窗最大宽度
      auto_caption: false          # 不自动把 alt 当作标题

# ===== Markdown 增强 =====
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# ===== 其他 =====
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yanran425

copyright: Copyright &copy; 2021 Yanran
